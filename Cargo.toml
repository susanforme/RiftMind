[workspace]
members = ["crates/riftmind-core", "tools/dev-harness", "src-tauri"]
default-members = ["crates/riftmind-core"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "=0.8.6", features = ["runtime-tokio", "sqlite", "migrate"], default-features = false }
tokio = { version = "1.48", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
