name: Windows x64 build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: bun install --frozen-lockfile
      - name: Build Windows x64 NSIS installer
        run: bun run tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --no-sign -- --locked
      - name: Prepare exactly three distribution files
        if: github.event_name != 'pull_request'
        id: package
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $commit = git rev-parse --short=8 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = "RiftMind-$version-$commit"
          $releaseDir = 'target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$releaseDir/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          if (-not (Test-Path "$releaseDir/riftmind.exe" -PathType Leaf)) { throw 'Missing portable executable.' }

          New-Item -ItemType Directory -Path artifacts | Out-Null
          $source = "artifacts/$prefix-source.zip"
          $installer = "artifacts/$prefix-windows-x64-setup.exe"
          $portable = "artifacts/$prefix-windows-x64-portable.zip"
          git archive --format=zip --prefix=RiftMind-source/ "--output=$source" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $installers[0].FullName $installer

          $portableDir = Join-Path $env:RUNNER_TEMP 'riftmind-portable'
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item "$releaseDir/riftmind.exe" $portableDir
          @'
          RiftMind Windows x64 portable
          Extract the ZIP before running riftmind.exe. No installation is required.
          Microsoft Edge WebView2 Runtime must already be installed:
          https://developer.microsoft.com/microsoft-edge/webview2/
          Extract into a dedicated user-writable directory. Downloaded resources are kept in assets beside riftmind.exe.
          Settings and data are stored in %APPDATA%\com.springbreeze.riftmind.
          This unsigned build may show a Windows SmartScreen warning.
          '@ | Set-Content (Join-Path $portableDir 'README.txt') -Encoding utf8
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portable
          if (@(Get-ChildItem artifacts -File).Count -ne 3) { throw 'Expected exactly three distribution files.' }
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
          "source=$source" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
      # Upload single files directly so ZIPs are not wrapped in another ZIP.
      - name: Upload source archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.source }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows x64 installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows x64 portable ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.portable }}
          archive: false
          if-no-files-found: error
          retention-days: 14
